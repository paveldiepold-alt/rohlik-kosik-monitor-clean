
    
  
name: Rohlík Košík – scan and publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prices.yml'
      - 'monitor.py'
      - 'catalog_scan.py'
      - 'promo_terms.py'
      - 'config.json'
      - 'requirements.txt'
      - 'docs/index.html'
      - 'tests/**'
  schedule:
    - cron: '25 5 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

# New group: older jobs from the previous workflow cannot hold this queue.
# A newer upload replaces a waiting/running instance of THIS version.
concurrency:
  group: rohlik-kosik-collect-v20-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    name: Collect and verify prices
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # IMPORTANT: No environment here. Price collection must never wait
    # for approval or lock on GitHub Pages.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check required program files
        run: |
          test -f monitor.py || (echo '::error::Missing monitor.py' && exit 1)
          test -f catalog_scan.py || (echo '::error::Missing catalog_scan.py' && exit 1)
          test -f promo_terms.py || (echo '::error::Missing promo_terms.py in repository root' && exit 1)
          test -f docs/index.html || (echo '::error::Missing docs/index.html' && exit 1)

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Mark scan start
        run: echo "RK_SCAN_STARTED=$(date -u +%Y-%m-%dT%H:%M:%S%z)" >> "$GITHUB_ENV"

      - name: Collect public sale offers
        run: python monitor.py

      - name: Verify this run produced fresh data
        shell: bash
        run: |
          python - <<'PYVERIFY'
          import datetime as dt, json, os, sys
          from pathlib import Path
          start=dt.datetime.strptime(os.environ['RK_SCAN_STARTED'],'%Y-%m-%dT%H:%M:%S%z')
          outputs={}
          for name in ('latest.json','search_status.json'):
              path=Path('docs/data')/name
              if not path.exists(): sys.exit(f'::error::{path} missing: scanner produced no output')
              try: data=json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc: sys.exit(f'::error::{path}: invalid JSON: {exc}')
              stamp=dt.datetime.fromisoformat(data['checked_at'])
              if not stamp.tzinfo or stamp < start-dt.timedelta(seconds=60):
                  sys.exit(f'::error::{path} is old ({stamp}); scan started at {start}')
              outputs[name]=data
          if outputs['latest.json']['checked_at'] != outputs['search_status.json']['checked_at']:
              sys.exit('::error::latest.json and search_status.json do not match')
          cov=outputs['latest.json'].get('catalog_coverage',{})
          if not cov.get('scan_plan_version') or cov.get('run_attempted') is None:
              sys.exit('::error::Missing scan version or per-run counters')
          if cov.get('scan_plan_version') != outputs['search_status.json'].get('coverage',{}).get('scan_plan_version'):
              sys.exit('::error::Scan version mismatch')
          print(f"Validated: {outputs['latest.json']['checked_at']} – {cov.get('run_attempted')}/{cov.get('run_planned')} queries")
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write(f"### Fresh price scan\nChecked at: {outputs['latest.json']['checked_at']}  \n")

